name: Probe Yamora production services
on:
  push:
    branches: [ main ]
    paths: [ '.github/workflows/render-production-check.yml' ]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check production endpoints
        run: |
          curl -fsSL https://orbit-relay-rql2.onrender.com/health -o /tmp/health.json
          curl -fsSL https://orbit-local-first-site.onrender.com/mobile/ -o /tmp/mobile.html
          curl -fsSL https://orbit-local-first-site.onrender.com/mobile-build-metadata.json -o /tmp/meta.json
          node - <<'NODE'
          const fs=require('fs');
          const h=JSON.parse(fs.readFileSync('/tmp/health.json','utf8'));
          const m=JSON.parse(fs.readFileSync('/tmp/meta.json','utf8'));
          console.log('HEALTH=' + JSON.stringify(h));
          console.log('META=' + JSON.stringify(m));
          if(h.ok!==true) process.exit(1);
          if(h.allowedOriginPolicyConfigured!==true) process.exit(2);
          if(h.pushNotificationServiceConfigured!==true) process.exit(3);
          if(m.product!=='Yamora Mobile PWA') process.exit(4);
          if(m.pushNotifications!=='opt-in-opaque-capability-generic-web-push') process.exit(5);
          NODE
          grep -q 'Yamora' /tmp/mobile.html
      - name: Remove probe workflow
        if: always()
        run: |
          git config user.name 'barakbenhur1'
          git config user.email '78704946+barakbenhur1@users.noreply.github.com'
          git rm .github/workflows/render-production-check.yml
          git commit -m 'chore: remove Yamora production probe'
          git push
