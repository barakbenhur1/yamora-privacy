name: Probe Yamora relay Mongo push health
on: push
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe relay health
        run: |
          set -euo pipefail
          curl -fsSL https://orbit-relay-rql2.onrender.com/health -o /tmp/health.json
          cat /tmp/health.json
          node -e "const h=require('/tmp/health.json'); if(!h.ok||!h.allowedOriginPolicyConfigured||!h.pushNotificationServiceConfigured||!h.pushPersistence) process.exit(1)"
      - name: Self-clean
        run: |
          git config user.name 'barakbenhur1'
          git config user.email '78704946+barakbenhur1@users.noreply.github.com'
          git rm .github/workflows/probe-relay-health.yml
          git commit -m 'chore: remove relay health probe'
          git push
